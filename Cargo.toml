[package]
name = "fairtime"
version = "0.1.0"
edition = "2024"
description = "Plan fair rotating meeting times across UTC offsets"
license = "MIT"
repository = "https://github.com/nicholas-ruest/fairtime"
readme = "README.md"
keywords = ["scheduling", "timezone", "meetings", "cli"]
categories = ["command-line-utilities", "date-and-time"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.23.0"
